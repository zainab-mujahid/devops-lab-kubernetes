apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-deployment
  namespace: dev-ns
  labels:
    app: devops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab-pod
  template:
    metadata:
      labels:
        app: devops-lab-pod
    spec:
      containers:
        - name: devops-lab-container
          image: zainabmujahid/devops-lab:v2
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: lab-configmap
            - secretRef:
                name: lab-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
          volumeMounts:
            - name: app-volume
              mountPath: /data
      volumes:
        - name: app-volume
          persistentVolumeClaim:
            claimName: lab-pvc