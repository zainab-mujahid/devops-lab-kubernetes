apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab
  labels:
    app: devops-lab
    team: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab
  template:
    metadata:
      labels:
        app: devops-lab
        tier: frontend
    spec:
      containers:
        - name: nextjs
          image: zainabmujahid/devops-lab:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000